openapi: 3.0.3
info:
  title: Dish Suitability API
  version: 1.1.0
  description: |
    Scores how suitable a dish is for a given time of day, from 0 (not suitable) to 10 (perfect).

    This specification is the source of truth for the API. The server's interface and models are
    generated from it at build time.

    **Authentication:** every call needs an API key in the `X-API-Key` header.

    **Tracing:** callers identify themselves with `X-Channel` and may send an `X-Request-ID`.
    Every response carries `X-Request-ID` (the caller's, or a generated one), which also appears in
    the server logs and in error responses, so a single call can be traced end to end.

    Errors follow RFC 7807 (`application/problem+json`).

servers:
  - url: https://localhost:8443
    description: Local (docker-compose up, self-signed certificate)

security:
  - ApiKeyAuth: []

tags:
  - name: DishSuitability
    description: Scoring dishes against a time of day

paths:
  /dish-suitability:
    post:
      tags: [DishSuitability]
      operationId: scoreDish
      summary: Score how suitable a dish is at a given time
      parameters:
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishSuitabilityRequest'
            examples:
              breakfastPancakes:
                summary: Pancakes at breakfast
                value: { "time": "08:30", "dish": "Pancakes" }
              dinnerChicken:
                summary: Chicken at dinner
                value: { "time": "18:00", "dish": "Chicken" }
      responses:
        '200':
          description: The suitability score
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishSuitabilityResponse'
              example: { "score": 10 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A key issued to each calling system. Several keys can be valid at once, so a key can be
        rotated without downtime.

  parameters:
    XChannel:
      name: X-Channel
      in: header
      required: true
      description: |
        Identifies the calling channel or system, e.g. `web`, `mobile-app`, `partner-acme`.
        Logged with every request.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,32}$'
      example: mobile-app
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Caller's identifier for this request, used to correlate logs across systems.
        If omitted, the server generates one. Returned in the `X-Request-ID` response header.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: 3f2c9a7e-8b1d-4c55-9e2a-6d0f1b7c4a21

  headers:
    XRequestId:
      description: The request's identifier (the caller's, or one generated by the server).
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Invalid request: a missing or invalid field or header, an unsupported dish, or malformed
        JSON.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationError:
              summary: Invalid field
              value:
                type: about:blank
                title: Invalid request
                status: 400
                detail: Request validation failed
                instance: /dish-suitability
                requestId: 3f2c9a7e-8b1d-4c55-9e2a-6d0f1b7c4a21
                errors:
                  time: time must be in 24-hour HH:mm format, e.g. 08:30
            unsupportedDish:
              summary: Unsupported dish
              value:
                type: about:blank
                title: Unsupported dish
                status: 400
                detail: "Unsupported dish: 'Pizza'"
                instance: /dish-suitability
                requestId: 3f2c9a7e-8b1d-4c55-9e2a-6d0f1b7c4a21
                acceptedDishes: [Pancakes, Chicken, IceCream]
    Unauthorized:
      description: The `X-API-Key` header is missing or the key is not valid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          description: The authentication scheme the server expects.
          schema:
            type: string
            example: ApiKey
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request body is not JSON.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error. No internal details are returned.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Dish:
      type: string
      description: |
        The dishes the service can score. Values are case-sensitive.

        Adding a value is backwards compatible for callers (they simply don't send it yet).
        Removing one is a breaking change, so it requires a new major version of the API.
      enum: [Pancakes, Chicken, IceCream]
      example: Pancakes
    DishSuitabilityRequest:
      type: object
      required: [time, dish]
      properties:
        time:
          type: string
          description: Local time of day in 24-hour format.
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '08:30'
        dish:
          $ref: '#/components/schemas/Dish'
    DishSuitabilityResponse:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          format: int32
          minimum: 0
          maximum: 10
          description: 0 = not suitable at all, 10 = perfect.
          example: 10
    Problem:
      type: object
      description: RFC 7807 problem details, plus optional extension fields.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
          description: Same value as the `X-Request-ID` response header; quote it when reporting a problem.
        errors:
          type: object
          description: Validation message per invalid field or header.
          additionalProperties:
            type: string
        acceptedDishes:
          type: array
          description: Present when the dish is not supported.
          items:
            $ref: '#/components/schemas/Dish'
