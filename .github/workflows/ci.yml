name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write   # needed to push the image to GitHub Container Registry

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Generate code from the OpenAPI spec, compile, unit tests (Surefire), integration tests
      # (Failsafe), formatting check (Spotless) and packaging
      - name: Build and run all checks
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  docker:
    name: Run with docker compose and smoke test over HTTPS
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-smoke-test-key
    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase; GitHub user/repo names may not be.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Exactly what a reviewer runs: builds the image, creates a certificate, starts on HTTPS.
      - name: Start the stack
        run: APP_SECURITY_API_KEYS="$API_KEY" docker compose up -d --build

      - name: Smoke test
        run: |
          CURL="curl -fsS --cacert certs/cert.pem"
          for i in $(seq 1 30); do $CURL https://localhost:8443/health && break; sleep 2; done
          $CURL https://localhost:8443/health | grep '"status":"UP"'

          $CURL -X POST https://localhost:8443/dish-suitability \
            -H 'Content-Type: application/json' -H "X-API-Key: $API_KEY" -H 'X-Channel: ci' \
            -d '{"time":"08:00","dish":"Pancakes"}' | grep '"score":10'

          status=$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/cert.pem \
            -X POST https://localhost:8443/dish-suitability \
            -H 'Content-Type: application/json' -H 'X-Channel: ci' \
            -d '{"time":"08:00","dish":"Pancakes"}')
          test "$status" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      # Only images from master are published. PRs are built and tested but not pushed.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with the commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag dish-suitability:local "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

      # Deployment would follow here: dev automatically, then staging and production
      # behind an approval gate. See "CI/CD flow" in the README.
